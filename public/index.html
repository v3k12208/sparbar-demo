<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spårbar Klimatportal (demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Roboto+Mono:wght@400;500&display=swap">
<style>
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Layout: a workbench in the client's colours — red context bar like their site header, white rail, charcoal behind the report preview, black type, pill buttons. */
:root {
  --bg: #f3f3f3; --surface: #ffffff; --surface-2: #f7f7f7; --sunken: #333333;
  --ink: #111111; --ink-2: #333333; --muted: #6b6b6b; --line: #e2e2e2; --line-2: #cfcfcf;
  --accent: #f00037; --accent-hover: #c8002e; --accent-ink: #ffffff; --accent-soft: #fde6eb; --accent-text: #c4002d;
  --bar-head: #f00037; --bar-head-ink: #ffffff;
  --hvo: #0f7f5c; --diesel: #c0782b; --bar: #333333; --bar-2: #b5b5b5;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b; --info: #3b6e9c;
  --good-text: #0b6e0b; --warning-text: #8a5d00; --serious-text: #a2471f; --critical-text: #b02c2c; --info-text: #2f5f8a;
  --paper: #ffffff; --paper-ink: #111111; --paper-muted: #5f5f5f; --paper-line: #e0e0e0; --paper-accent: #f00037; --paper-accent-text: #c4002d; --paper-soft: #f4f4f4;
  --focus: #2f7de1; --shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 6px 18px rgba(0, 0, 0, .05);
  --f-display: 'Roboto', 'Helvetica Neue', Arial, sans-serif;
  --f-body: 'Roboto', 'Helvetica Neue', Arial, system-ui, sans-serif;
  --f-mono: 'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r: 10px; --r-s: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111111; --surface: #1b1b1b; --surface-2: #222222; --sunken: #2a2a2a;
    --ink: #f2f2f2; --ink-2: #cfcfcf; --muted: #9a9a9a; --line: #2c2c2c; --line-2: #3d3d3d;
    --accent: #f00037; --accent-hover: #ff2d5a; --accent-ink: #ffffff; --accent-soft: #3a1018; --accent-text: #ff6b86;
    --bar-head: #c8002e; --bar-head-ink: #ffffff;
    --hvo: #2a9e78; --diesel: #c4862f; --bar: #e6e6e6; --bar-2: #5a5a5a;
    --good-text: #5fd35f; --warning-text: #fbc54f; --serious-text: #f29d7c; --critical-text: #ee7b7b; --info: #79a9d6; --info-text: #94bde3;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111111; --surface: #1b1b1b; --surface-2: #222222; --sunken: #2a2a2a;
  --ink: #f2f2f2; --ink-2: #cfcfcf; --muted: #9a9a9a; --line: #2c2c2c; --line-2: #3d3d3d;
  --accent: #f00037; --accent-hover: #ff2d5a; --accent-ink: #ffffff; --accent-soft: #3a1018; --accent-text: #ff6b86;
  --bar-head: #c8002e; --bar-head-ink: #ffffff;
  --hvo: #2a9e78; --diesel: #c4862f; --bar: #e6e6e6; --bar-2: #5a5a5a;
  --good-text: #5fd35f; --warning-text: #fbc54f; --serious-text: #f29d7c; --critical-text: #ee7b7b; --info: #79a9d6; --info-text: #94bde3;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 40px; -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
h1, h2, h3, h4 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 30px; font-weight: 900; line-height: 1.12; }
h2 { font-size: 20px; font-weight: 700; line-height: 1.25; }
h3 { font-size: 16px; font-weight: 700; }
h4 { font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
p { margin: 0; }
a { color: var(--accent-text); text-underline-offset: 2px; }
code, .mono { font-family: var(--f-mono); font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- Shell ---------- */
.app { display: grid; grid-template-columns: 228px minmax(0, 1fr); gap: 20px; max-width: 1440px; margin: 0 auto; align-items: start; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); display: flex; flex-direction: column; gap: 18px; padding: 18px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-height: calc(100vh - 32px); }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.brand-mark { width: 30px; height: 30px; flex: none; }
.brand-name { font-family: var(--f-display); font-weight: 900; font-size: 21px; letter-spacing: -0.02em; line-height: 1; }
.brand-sub { font-size: 11.5px; color: var(--muted); line-height: 1.3; margin-top: 3px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-s); color: var(--ink-2); text-decoration: none; font-weight: 500; font-size: 13.5px; }
.nav a:hover { background: var(--surface-2); color: var(--ink); }
.nav a { border-radius: 999px; }
.nav a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.nav a[aria-current="page"] .badge { background: rgba(255, 255, 255, .25); color: #fff; }
.nav svg { width: 17px; height: 17px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.nav .badge { margin-left: auto; font-size: 11px; font-weight: 650; padding: 1px 7px; border-radius: 999px; background: color-mix(in srgb, var(--serious) 22%, transparent); color: var(--serious-text); }
.nav-sep { height: 1px; background: var(--line); margin: 6px 4px; }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; font-size: 12px; color: var(--muted); padding: 0 6px; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 999px; padding: 2px; background: var(--surface-2); }
.seg button { border: 0; background: transparent; color: var(--ink-2); font: inherit; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

.main { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.ctxbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 18px; background: var(--bar-head); color: var(--bar-head-ink); border-radius: var(--r); box-shadow: 0 6px 18px rgba(0, 0, 0, .12); }
.ctxbar .ctx-field label { color: rgba(255, 255, 255, .85); }
.ctxbar select, .ctxbar input { background: #ffffff; color: #111111; border-color: transparent; color-scheme: light; }
.ctxbar .pill, .ctxbar .pill.draft, .ctxbar .pill.locked, .ctxbar .pill.sample { background: rgba(255, 255, 255, .14); border-color: rgba(255, 255, 255, .55); color: #ffffff; }
.ctxbar .pill.draft .dot { color: #fbc54f; }
.ctxbar .pill.locked .dot { color: #7ee07e; }
.ctx-field { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ctx-field label, .lbl { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.ctx-dates { display: flex; gap: 6px; align-items: center; }
.ctx-spacer { flex: 1 1 auto; }
select, input[type="text"], input[type="number"], input[type="date"], input[type="search"], textarea {
  font: inherit; font-size: 13.5px; color: var(--ink); background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-s); padding: 6px 9px; min-width: 0; max-width: 100%;
}
input[type="number"] { font-variant-numeric: tabular-nums; }
select { padding-right: 26px; }
textarea { width: 100%; font-family: var(--f-mono); font-size: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; font: inherit; font-size: 13.5px; font-weight: 500; padding: 8px 16px; border-radius: 999px; border: 1.5px solid var(--ink-2); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent-text); padding-inline: 10px; }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.small { font-size: 12.5px; padding: 5px 10px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 650; border: 1px solid var(--line-2); color: var(--ink-2); background: var(--surface-2); white-space: nowrap; }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.draft { color: var(--warning-text); border-color: color-mix(in srgb, var(--warning) 50%, transparent); background: color-mix(in srgb, var(--warning) 12%, var(--surface)); }
.pill.locked { color: var(--good-text); border-color: color-mix(in srgb, var(--good) 45%, transparent); background: color-mix(in srgb, var(--good) 10%, var(--surface)); }
.pill.sample { color: var(--info-text); border-color: color-mix(in srgb, var(--info) 45%, transparent); background: color-mix(in srgb, var(--info) 10%, var(--surface)); }

/* ---------- Content ---------- */
.view { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.vhead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 4px 2px 0; }
.vhead p { color: var(--ink-2); max-width: 68ch; margin-top: 6px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.card-h p { color: var(--muted); font-size: 12.5px; }
.card-h > div:first-child { flex: 1 1 240px; min-width: 0; }
.grid { display: grid; gap: 18px; }
.g-hero { grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-side { grid-template-columns: 300px minmax(0, 1fr); align-items: start; }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.tiny { font-size: 11.5px; }
.sep { height: 1px; background: var(--line); }

.hero-card { display: flex; flex-direction: column; gap: 14px; }
.hero-label { font-size: 13px; color: var(--ink-2); font-weight: 500; }
.hero-num { font-family: var(--f-body); font-weight: 700; font-size: clamp(44px, 6vw, 64px); line-height: 1; letter-spacing: -0.03em; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.hero-num .unit { font-size: 20px; font-weight: 600; color: var(--ink-2); letter-spacing: 0; }
.hero-sub { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--ink-2); font-size: 13px; }
.hero-sub b { font-weight: 650; color: var(--ink); font-variant-numeric: tabular-nums; }
.tile { display: flex; flex-direction: column; gap: 6px; }
.tile .k { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.tile .v { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
.tile .v small { font-size: 13px; font-weight: 600; color: var(--ink-2); letter-spacing: 0; margin-left: 4px; }
.tile .d { font-size: 12px; color: var(--muted); }

/* Charts (HTML bars) */
.hbars { display: flex; flex-direction: column; gap: 7px; }
.hbar { display: grid; grid-template-columns: minmax(110px, 190px) minmax(0, 1fr) 76px; align-items: center; gap: 10px; border: 0; background: none; padding: 2px 0; font: inherit; color: inherit; text-align: left; cursor: pointer; border-radius: 4px; }
.hbar:hover .hbar-name { color: var(--ink); }
.hbar:hover .hbar-fill { background: var(--accent); }
.hbar-name { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hbar-track { height: 14px; position: relative; }
.hbar-fill { position: absolute; inset: 0 auto 0 0; background: var(--bar); border-radius: 0 4px 4px 0; min-width: 2px; }
.hbar-fill.other { background: var(--bar-2); }
.hbar-val { font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.cols { position: relative; height: 210px; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 8px; padding: 0 0 26px 44px; }
.cols-grid { position: absolute; inset: 0 0 26px 44px; pointer-events: none; }
.cols-grid div { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--line); }
.cols-grid span { position: absolute; left: -44px; width: 38px; text-align: right; transform: translateY(-50%); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.col { position: relative; display: flex; align-items: flex-end; justify-content: center; height: 100%; border: 0; background: none; padding: 0; cursor: pointer; font: inherit; color: inherit; }
.col-fill { width: min(24px, 70%); background: var(--bar); border-radius: 4px 4px 0 0; min-height: 2px; }
.col:hover .col-fill { background: var(--accent); }
.col-lbl { position: absolute; bottom: -22px; left: 0; right: 0; text-align: center; font-size: 11.5px; color: var(--muted); }
.col-val { position: absolute; left: -20px; right: -20px; text-align: center; font-size: 11.5px; color: var(--ink-2); font-weight: 600; font-variant-numeric: tabular-nums; }
.segbar { display: flex; gap: 2px; height: 28px; }
.segbar > div { border-radius: 4px; display: flex; align-items: center; padding-left: 8px; font-size: 12px; font-weight: 650; color: #fff; min-width: 0; overflow: hidden; white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.chart-toggle { font-size: 12px; }

/* Tables */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-s); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 650; background: var(--surface-2); white-space: nowrap; position: sticky; top: 0; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
td.num, td.r { white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: var(--surface-2); }
tfoot td { font-weight: 700; border-top: 2px solid var(--line-2); background: var(--surface-2); }
td input[type="number"] { width: 84px; padding: 4px 6px; font-size: 12.5px; }
.code { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }

/* Status chips */
.sev { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 2px 8px 2px 6px; border-radius: 999px; white-space: nowrap; }
.sev svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.sev.critical { color: var(--critical-text); background: color-mix(in srgb, var(--critical) 14%, transparent); }
.sev.serious { color: var(--serious-text); background: color-mix(in srgb, var(--serious) 18%, transparent); }
.sev.warning { color: var(--warning-text); background: color-mix(in srgb, var(--warning) 20%, transparent); }
.sev.info { color: var(--info-text); background: color-mix(in srgb, var(--info) 14%, transparent); }
.sev.ok { color: var(--good-text); background: color-mix(in srgb, var(--good) 14%, transparent); }
.checklist { display: flex; flex-direction: column; }
.check { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.check:first-child { border-top: 0; padding-top: 2px; }
.check b { display: block; font-weight: 650; margin-bottom: 2px; }
.check p { color: var(--ink-2); font-size: 13px; }
.cov { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 650; white-space: nowrap; }
.cov svg { width: 15px; height: 15px; }
.cov.yes { color: var(--good-text); } .cov.part { color: var(--warning-text); } .cov.plan { color: var(--muted); }

/* Forms in panels */
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > span { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.field small { color: var(--muted); font-size: 11.5px; }
.field select, .field input { width: 100%; }
.field input[type="radio"], .field input[type="checkbox"] { width: auto; flex: none; }
.check-row { display: flex; gap: 9px; align-items: flex-start; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.check-row input { margin-top: 3px; accent-color: var(--accent); }
.radio-row { display: flex; flex-direction: column; gap: 6px; }
input[type="range"] { accent-color: var(--accent); width: 100%; }
.panel-sec { display: flex; flex-direction: column; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); }
.panel-sec:first-child { border-top: 0; padding-top: 0; }
.btn-col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn-col .btn { width: 100%; }

.drop { border: 1.5px dashed var(--line-2); border-radius: var(--r); padding: 22px; text-align: center; background: var(--surface-2); display: flex; flex-direction: column; gap: 8px; align-items: center; transition: border-color .15s, background .15s; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop svg { width: 26px; height: 26px; stroke: var(--accent-text); fill: none; stroke-width: 1.6; }
.drop input { display: none; }
.note { border-left: 3px solid var(--info); background: color-mix(in srgb, var(--info) 8%, var(--surface)); padding: 10px 12px; border-radius: 0 var(--r-s) var(--r-s) 0; font-size: 13px; color: var(--ink-2); }
.note.warn { border-left-color: var(--warning); background: color-mix(in srgb, var(--warning) 10%, var(--surface)); }
.note.good { border-left-color: var(--good); background: color-mix(in srgb, var(--good) 8%, var(--surface)); }

/* Report document */
.docwrap { background: var(--sunken); border-radius: var(--r); padding: 22px; overflow-x: auto; }
.doc { background: var(--paper); color: var(--paper-ink); width: 100%; max-width: 820px; margin: 0 auto; padding: 36px 30px 30px; border-radius: 4px; box-shadow: 0 2px 10px rgba(0, 0, 0, .12); font-size: 12.5px; line-height: 1.5; position: relative; min-width: 560px; }
.doc .draftmark { position: absolute; top: 18px; right: 22px; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: #9a6b00; border: 1px solid #e3c88a; background: #fff8e6; padding: 2px 8px; border-radius: 3px; }
.doc .draftmark.locked { color: #0b6e0b; border-color: #9fd59f; background: #eefaee; }
.doc-top { display: flex; justify-content: space-between; gap: 20px; align-items: flex-end; padding-bottom: 16px; border-bottom: 3px solid var(--paper-accent); }
.doc-issuer { font-family: var(--f-display); font-weight: 700; font-size: 15px; }
.doc-title { font-family: var(--f-display); font-weight: 900; font-size: 27px; line-height: 1.1; margin-top: 4px; letter-spacing: -0.01em; }
.doc-meta { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 18px; padding: 14px 0; border-bottom: 1px solid var(--paper-line); }
.doc-meta .lbl { color: var(--paper-muted); font-size: 10px; }
.doc-meta div div { font-weight: 600; }
.doc-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; margin: 18px 0; border: 1px solid var(--paper-line); border-radius: 4px; }

<script>
/* Spårbar demo: stands in for the Claude artifact runtime when the portal runs on its own.
 *   sample    -> POST api/ai on the demo server (Claude via your API key; the key never reaches the browser)
 *   downloads -> normal browser downloads
 *   db        -> this browser's localStorage (archive, receipts, settings; not shared between people)
 *   user      -> a single local demo user
 * Inside Claude the real runtime exists and this file does nothing. */
(function () {
  'use strict';
  if (window.claude && typeof window.claude.use === 'function') return;
  // Bundled copies of the export and PDF libraries, so the demo works without CDNs or Wi-Fi.
  window.SPARBAR_LIBS = { xlsx: 'vendor/xlsx.full.min.js', jspdf: 'vendor/jspdf.umd.min.js', autotable: 'vendor/jspdf.plugin.autotable.min.js', pdfjs: 'vendor/pdf.min.js', pdfworker: 'vendor/pdf.worker.min.js' };

  // ---------- db (localStorage) ----------
  const KEY = 'sparbar-demo-db';
  // http://127.0.0.1:3000/?reset starts the demo from scratch: no handled checks, no locked reports, employee mode.
  if (/[?&]reset\b/.test(location.search)) {
    try { Object.keys(localStorage).filter((k) => k === KEY || k.indexOf('sparbar.') === 0).forEach((k) => localStorage.removeItem(k)); } catch (e) { /* storage blocked */ }
    history.replaceState(null, '', location.pathname + location.hash);
  }
  let data = {};
  try { data = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { data = {}; }
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* storage full or blocked: keep in memory */ } };
  const listeners = new Set();
  const notify = () => listeners.forEach((fn) => { try { fn(); } catch (e) { console.error(e); } });
  const meta = Object.freeze({ fromCache: false, hasPendingWrites: false });
  const copy = (v) => JSON.parse(JSON.stringify(v));
  const snap = (path) => ({ id: path.split('/').pop(), exists: Object.prototype.hasOwnProperty.call(data, path), data: () => (path in data ? copy(data[path]) : undefined), metadata: meta });

  function docRef(path) {
    return {
      id: path.split('/').pop(), path,
      async get() { return snap(path); },
      async set(v) { data[path] = copy(v); persist(); notify(); },
      async update(v) { if (!(path in data)) throw { code: 'invalid_argument', message: 'Document does not exist' }; Object.assign(data[path], copy(v)); persist(); notify(); },
      async delete() { delete data[path]; persist(); notify(); },
      onSnapshot(next) { const fn = () => next(snap(path)); listeners.add(fn); setTimeout(fn, 0); return () => listeners.delete(fn); },
      collection(sub) { return collRef(path + '/' + sub); }
    };
  }
  function collRef(path, q) {
    q = q || {};
    const list = () => {
      let docs = Object.keys(data).filter((k) => k.startsWith(path + '/') && !k.slice(path.length + 1).includes('/')).map(snap);
      if (q.order) {
        const [f, dir] = q.order;
        docs.sort((a, b) => { const x = a.data()[f], y = b.data()[f]; return (x < y ? -1 : x > y ? 1 : 0) * (dir === 'desc' ? -1 : 1); });
      } else docs.sort((a, b) => (a.id < b.id ? -1 : 1));
      if (q.limit) docs = docs.slice(0, q.limit);
      return { docs, size: docs.length, empty: !docs.length, docChanges: () => docs.map((d, i) => ({ type: 'added', doc: d, oldIndex: -1, newIndex: i })), metadata: meta };
    };
    return {
      path,
      doc(id) { return docRef(path + '/' + (id || Date.now().toString(36) + Math.random().toString(36).slice(2, 8))); },
      async add(v) { const r = this.doc(); await r.set(v); return r; },
      where() { return this; },
      orderBy(f, dir) { return collRef(path, Object.assign({}, q, { order: [f, dir || 'asc'] })); },
      limit(n) { return collRef(path, Object.assign({}, q, { limit: n })); },
      async get() { return list(); },
      onSnapshot(next) { const fn = () => next(list()); listeners.add(fn); setTimeout(fn, 0); return () => listeners.delete(fn); }
    };
  }
  const db = { doc: docRef, collection: (p) => collRef(p) };

  // ---------- downloads ----------
  const downloads = {
    async save({ filename, data: payload }) {
      const blob = payload instanceof Blob ? payload : new Blob([payload]);
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      return { status: 'saved' };
    }
  };

  // ---------- user ----------
  const user = {
    async id() { return 'demo-user'; }, async me() { return { id: 'demo-user', name: 'Demo' }; },
    async profiles(ids) { const o = {}; ids.forEach((i) => { o[i] = { id: i, name: 'Demo' }; }); return o; },
    isOwner: () => true, canEdit: () => true, can: () => true
  };

  // ---------- sample (Claude via the demo server) ----------
  const toB64 = (b) => new Promise((resolve, reject) => { const r = new FileReader(); r.onload = () => resolve(String(r.result).split(',')[1]); r.onerror = reject; r.readAsDataURL(b); });
  async function call(input, opts, mode) {
    opts = opts || {};
    const list = opts.images ? (opts.images instanceof Blob ? [opts.images] : Array.from(opts.images)) : [];
    const images = await Promise.all(list.map(async (b) => ({ mediaType: b.type || 'image/png', data: await toB64(b) })));
    const stream = !!opts.onText && mode === 'text';
    let res;
    try {
      res = await fetch('api/ai', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ input, images, mode, stream }), signal: opts.signal });
    } catch (e) {
      throw { code: e && e.name === 'AbortError' ? 'cancelled' : 'upstream_error', message: 'The demo server did not answer.' };
    }
    if (!res.ok) { const e = await res.json().catch(() => ({})); throw { code: e.code || 'upstream_error', message: e.message || 'HTTP ' + res.status }; }
    let text = '';
    if (stream && res.body) {
      const reader = res.body.getReader(), dec = new TextDecoder();
      try {
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          const delta = dec.decode(value, { stream: true });
          if (!delta) continue;
          text += delta; opts.onText({ text, delta });
        }
      } catch (e) { throw { code: e && e.name === 'AbortError' ? 'cancelled' : 'upstream_error', message: 'Interrupted', text }; }
    } else text = await res.text();
    if (!text.trim()) throw { code: 'empty_completion', message: 'Empty answer' };
    return { text, truncated: false, modelTierApplied: 'default' };
  }
  function parseJson(t) {
    try { return JSON.parse(t); } catch (e) { /* try fences and brackets below */ }
    const f = /```(?:json)?\s*([\s\S]*?)```/.exec(t);
    if (f) { try { return JSON.parse(f[1]); } catch (e) { /* fall through */ } }
    const s = t.search(/[[{]/), e = Math.max(t.lastIndexOf(']'), t.lastIndexOf('}'));
    if (s >= 0 && e > s) { try { return JSON.parse(t.slice(s, e + 1)); } catch (err) { /* fall through */ } }
    return undefined;
  }
  const sample = (input, opts) => call(input, opts, 'text');
  sample.json = async (input, opts) => {
    const r = await call(input, Object.assign({}, opts, { onText: undefined }), 'json');
    const v = parseJson(r.text);
    if (v === undefined) throw { code: 'invalid_json', message: 'The answer was not JSON', text: r.text };
    return v;
  };
  sample.limits = async () => ({ maxPromptBytes: 262144, images: { maxCount: 5, maxInputBytes: 10 * 1024 * 1024, mediaTypes: ['image/jpeg', 'image/png', 'image/webp', 'image/gif'] } });

  const caps = { db, downloads, user, sample };
  window.claude = { use: (name) => Promise.resolve(caps[name] || null) };
})();

          article: idx.article != null ? String(r[idx.article] || '') : '',
          km: idx.km != null ? num(r[idx.km]) : null, qty: idx.qty != null ? num(r[idx.qty]) : null,
          unit: idx.unit != null ? String(r[idx.unit] || '').toUpperCase() : null,
          customer: idx.customer != null && r[idx.customer] != null && r[idx.customer] !== '' ? String(r[idx.customer]) : null,
          supplier: idx.supplier != null ? r[idx.supplier] : null
        });
      }
      const hasActivity = idx.qty != null && idx.unit != null;
      if (lines.length) return { kind: hasActivity ? 'orders' : 'invoiceLines', lines, blankAmounts: lines.every((l) => !l.amount) };
    }
    if (H.includes('andel drivmedel diesel') && H.includes('andel drivmedel hvo')) {
      const iC = H.indexOf('resurstyp'), iN = H.indexOf('namn'), iD = H.indexOf('andel drivmedel diesel'), iH = H.indexOf('andel drivmedel hvo');
      if (iN >= 0 && iC >= 0) {
        const out = rows.slice(1).filter((r) => r[iC] != null && r[iC] !== '').map((r) => {
          // Excel table uses percent (11.5); Rapportdata uses fractions (0.115) — normalise to percent
          let d = num(r[iD]), h = num(r[iH]);
          if (d != null && d < 1) d *= 100; if (h != null && h < 1) h *= 100;
          return [String(r[iC]), r[iN], d, h];
        });
        return { kind: 'resourceTypes', rows: out };
      }
    }
    return { kind: 'unknown', headers };
  }

  // ---------- Periods ----------
  function periodPresets(minDate, maxDate) {
    const y0 = Number(minDate.slice(0, 4)), y1 = Number(maxDate.slice(0, 4));
    const out = [];
    for (let y = y1; y >= y0; y--) {
      out.push({ id: `H1-${y}`, from: `${y}-01-01`, to: `${y}-06-30`, label: { sv: `Halvår 1 ${y}`, en: `H1 ${y}` }, short: `1-${y}` });
      out.push({ id: `H2-${y}`, from: `${y}-07-01`, to: `${y}-12-31`, label: { sv: `Halvår 2 ${y}`, en: `H2 ${y}` }, short: `2-${y}` });
      out.push({ id: `Y-${y}`, from: `${y}-01-01`, to: `${y}-12-31`, label: { sv: `Helår ${y}`, en: `Full year ${y}` }, short: `${y}` });
      for (let q = 1; q <= 4; q++) {
        const m0 = (q - 1) * 3 + 1, m1 = m0 + 2;
        const last = new Date(Date.UTC(y, m1, 0)).getUTCDate();
        out.push({ id: `Q${q}-${y}`, from: `${y}-${String(m0).padStart(2, '0')}-01`, to: `${y}-${String(m1).padStart(2, '0')}-${last}`, label: { sv: `Kvartal ${q} ${y}`, en: `Q${q} ${y}` }, short: `Q${q}-${y}` });
      }
    }
    return out.filter((p) => p.to >= minDate && p.from <= maxDate);
  }

  // ---------- Core calculation ----------
  function inScope(lines, ctx) {
    return lines.filter((l) => l.date >= ctx.from && l.date <= ctx.to && (ctx.customer == null || l.customer === ctx.customer));
  }

  function hvoPctFor(ctx, code) {
    const p = ctx.fuelPlan.byType && ctx.fuelPlan.byType[code];
    return p == null ? ctx.fuelPlan.hvoPct : p;
  }

  function calcGroup(amount, code, ctx) {
    // returns fuel parts for one vehicle type given an invoiced amount
    const rt = ctx.resourceTypes.get(code);
    const parts = [];
    if (!rt) return { parts, excluded: amount, reason: 'unknownType' };
    const pH = hvoPctFor(ctx, code);
    const plan = [[ctx.fuelPlan.hvoFuel, pH], [ctx.fuelPlan.dieselFuel, 1 - pH]];
    let excluded = 0, reason = null;
    for (const [fk, p] of plan) {
      if (p <= 0) continue;
      const f = ctx.fuels[fk];
      const share = rt[f.shareCol];
      const amt = amount * p;
      if (share == null) { excluded += amt; reason = 'noShare'; continue; }
      const price = ctx.prices[f.shareCol];
      const fuelCost = amt * share;
      const liters = fuelCost / price;
      parts.push({
        fuel: fk, amount: amt, share, fuelCost, price, liters, ef: f.wtw, eft: f.ttw,
        kgWtw: liters * f.wtw, kgTtw: liters * f.ttw, kgWtt: liters * (f.wtw - f.ttw), mj: liters * f.mj, bioMj: liters * f.mj * f.bio
      });
    }
    return { parts, excluded, reason };
  }

  function tonnesOf(l) { const k = UNIT_TONNES[l.unit]; return k && l.qty ? l.qty * k : 0; }

  function compute(lines, ctx) {
    const scope = inScope(lines, ctx);
    const inv = scope.filter((l) => ctx.statuses.includes(l.status));
    const types = new Map();
    const months = new Map();
    for (const l of inv) {
      const code = l.rtype == null ? '—' : l.rtype;
      let g = types.get(code);
      if (!g) { g = { code, amount: 0, n: 0, km: 0, tonnes: 0, tkm: 0, kmCovered: 0, lines: [] }; types.set(code, g); }
      g.amount += l.amount; g.n++; g.lines.push(l);
      const t = isEmptyRun(l.article) ? 0 : tonnesOf(l);
      if (l.km) g.km += l.km;
      g.tonnes += t;
      if (l.km && t) { g.tkm += t * l.km; g.kmCovered += l.amount; }
      const mk = l.date.slice(0, 7);
      let m = months.get(mk); if (!m) { m = new Map(); months.set(mk, m); }
      m.set(code, (m.get(code) || 0) + l.amount);
    }
    const rows = [], excluded = [];
    const tot = { amount: 0, liters: 0, kgWtw: 0, kgTtw: 0, kgWtt: 0, mj: 0, bioMj: 0, fuelCost: 0, byFuel: {}, excludedAmount: 0, tkm: 0, km: 0, kmCoveredAmount: 0, orders: inv.length };
    for (const g of types.values()) {
      const rt = ctx.resourceTypes.get(g.code);
      const name = rt ? rt.name : (g.code === '—' ? '(saknar resurstyp)' : g.code);
      const c = calcGroup(g.amount, g.code, ctx);
      tot.tkm += g.tkm; tot.km += g.km; tot.kmCoveredAmount += g.kmCovered;
      if (c.excluded) { excluded.push({ code: g.code, name, amount: c.excluded, n: g.n, reason: c.reason }); tot.excludedAmount += c.excluded; }
      for (const p of c.parts) {
        if (Math.abs(g.amount) < 0.005) continue; // types with orders but nothing invoiced add no rows
        const row = Object.assign({ code: g.code, name, n: g.n, km: g.km, tonnes: g.tonnes, tkm: g.tkm, groupAmount: g.amount }, p);
        rows.push(row);
        tot.amount += p.amount; tot.liters += p.liters; tot.kgWtw += p.kgWtw; tot.kgTtw += p.kgTtw; tot.kgWtt += p.kgWtt; tot.mj += p.mj; tot.bioMj += p.bioMj; tot.fuelCost += p.fuelCost;
        const bf = tot.byFuel[p.fuel] || (tot.byFuel[p.fuel] = { liters: 0, kgWtw: 0, mj: 0 });
        bf.liters += p.liters; bf.kgWtw += p.kgWtw; bf.mj += p.mj;
      }
    }
    rows.sort((a, b) => b.kgWtw - a.kgWtw);
    // Monthly series
    const monthly = [...months.keys()].sort().map((mk) => {
      let kg = 0, liters = 0, amount = 0;
      for (const [code, amt] of months.get(mk)) {
        const c = calcGroup(amt, code, ctx);
        for (const p of c.parts) { kg += p.kgWtw; liters += p.liters; amount += p.amount; }
      }
      return { month: mk, kgWtw: kg, liters, amount };
    });
    // Tonnage
    const tonnesExcelBasis = scope.reduce((s, l) => s + tonnesOf(l), 0);
    const tonnesInvoiced = inv.reduce((s, l) => s + (isEmptyRun(l.article) ? 0 : tonnesOf(l)), 0);
    const tonnes = ctx.tonnageBasis === 'excel' ? tonnesExcelBasis : tonnesInvoiced;
    const totalInvoiced = inv.reduce((s, l) => s + l.amount, 0);
    tot.tonnes = tonnes; tot.tonnesExcelBasis = tonnesExcelBasis; tot.tonnesInvoiced = tonnesInvoiced;
    tot.kgPerTonne = tonnes ? tot.kgWtw / tonnes : null;
    tot.gPerTkm = tot.tkm ? tot.kgWtw * 1000 / tot.tkm : null;
    tot.tkmCoverage = totalInvoiced ? tot.kmCoveredAmount / totalInvoiced : 0;
    tot.renewableShare = tot.mj ? tot.bioMj / tot.mj : 0;
    tot.mwh = tot.mj / 3600;
    tot.mwhRenewable = tot.bioMj / 3600;
    tot.totalInvoiced = totalInvoiced;
    return { rows, excluded, monthly, totals: tot, scopeCount: scope.length, invoicedCount: inv.length, types };
  }

  // ---------- Receipts ----------
  function normalizeFuel(s) {
    const t = String(s || '').toLowerCase();
    if (/hvo|evolution diesel|neste my|förnybar diesel|renewable diesel/.test(t)) return 'hvo';
    if (/b100|fame|rme/.test(t)) return 'b100';
    if (/diesel|mk1|dieselbr|eco ?diesel/.test(t)) return 'diesel';

  }
  function receiptStats(receipts, from, to, vatIncluded) {
    const per = {}; let n = 0;

      if (!r.date || r.date < from || r.date > to) continue;
      const k = r.fuelClass || normalizeFuel(r.fuel);
      if (!['hvo', 'diesel', 'b100'].includes(k)) continue;
      const liters = Number(r.liters) || 0; if (liters <= 0) continue;

      if (amount != null && (r.vatIncluded != null ? r.vatIncluded : vatIncluded)) amount = amount / 1.25;
      const p = per[k] || (per[k] = { liters: 0, amount: 0, pricedLiters: 0, n: 0 });
      p.liters += liters; p.n++; n++;
      if (amount != null && Number.isFinite(amount)) { p.amount += amount; p.pricedLiters += liters; }
    }
    for (const p of Object.values(per)) p.avgPrice = p.pricedLiters ? p.amount / p.pricedLiters : null;
    const lHvo = (per.hvo ? per.hvo.liters : 0) + (per.b100 ? per.b100.liters : 0);
    const lDie = per.diesel ? per.diesel.liters : 0;
    return { per, n, hvoShareOfVolume: lHvo + lDie ? lHvo / (lHvo + lDie) : null };
  }

  // ---------- Checks ----------
  function checks(lines, res, ctx, extra) {
    extra = extra || {};
    const out = [];
    const add = (sev, id, sv, en, data) => out.push({ sev, id, sv, en, data: data || null });
    const scope = inScope(lines, ctx);
    const inv = scope.filter((l) => ctx.statuses.includes(l.status));
    const fmt = (n, d = 0) => new Intl.NumberFormat('sv-SE', { maximumFractionDigits: d, minimumFractionDigits: d }).format(n);
    const fmtE = (n, d = 0) => new Intl.NumberFormat('en-GB', { maximumFractionDigits: d, minimumFractionDigits: d }).format(n);

    if (!inv.length) {
      add('critical', 'noData', { t: 'Inga fakturerade rader i vald period', d: 'Välj en annan period eller kund, eller importera data för perioden.' }, { t: 'No invoiced rows in the selected period', d: 'Pick another period or customer, or import data for the period.' });
      return out;
    }
    // Excluded vehicle types
    for (const e of res.excluded) {
      add(Math.abs(e.amount) > 10000 ? 'serious' : 'warning', 'excluded-' + e.code,
        { t: `${e.name} (${e.code}) saknar drivmedelsandel`, d: `${fmt(e.amount, 2)} kr på ${e.n} rader räknas inte med. Lägg till andelar under Faktorer om typen förbrukar drivmedel.` },
        { t: `${e.name} (${e.code}) has no fuel cost share`, d: `${fmtE(e.amount, 2)} SEK on ${e.n} rows is left out. Add shares under Factors if this type uses fuel.` }, { code: e.code });
    }
    // Credit notes / negative amounts on included types
    const neg = inv.filter((l) => l.amount < 0 && !res.excluded.some((e) => e.code === l.rtype));
    if (neg.length) {
      const s = neg.reduce((a, l) => a + l.amount, 0);
      add('warning', 'negatives', { t: `${neg.length} krediteringar minskar utsläppen`, d: `Negativa belopp på ${fmt(s, 2)} kr dras av i kostnadsmodellen. Kontrollera att de avser prisjusteringar och inte ångrade körningar.` },
        { t: `${neg.length} credit notes reduce emissions`, d: `Negative amounts of ${fmtE(s, 2)} SEK are subtracted in the cost model. Check that they are price adjustments, not cancelled trips.` });
    }
    // Tonnage double counting
    const nonInvTon = scope.filter((l) => !ctx.statuses.includes(l.status)).reduce((s, l) => s + tonnesOf(l), 0);
    if (nonInvTon > 0) {
      const sevT = ctx.tonnageBasis === 'excel' ? 'serious' : 'info';
      add(sevT, 'tonnage', { t: `${fmt(nonInvTon)} ton kommer från ej fakturerade rader`, d: `Rader med status ${[...new Set(scope.filter((l) => !ctx.statuses.includes(l.status)).map((l) => l.status))].join(', ')} (t.ex. materialrader) bär vikt men inget transportbelopp. Nuvarande Excel räknar med dem (${fmt(res.totals.tonnesExcelBasis)} t). Endast fakturerade transporter: ${fmt(res.totals.tonnesInvoiced)} t.` + (ctx.tonnageBasis === 'excel' ? ' Byt till "Endast fakturerade" om de är dubbletter.' : '') },
        { t: `${fmtE(nonInvTon)} t come from non-invoiced rows`, d: `Rows with status ${[...new Set(scope.filter((l) => !ctx.statuses.includes(l.status)).map((l) => l.status))].join(', ')} (e.g. material lines) carry weight but no transport amount. The current Excel counts them (${fmtE(res.totals.tonnesExcelBasis)} t). Invoiced transports only: ${fmtE(res.totals.tonnesInvoiced)} t.` + (ctx.tonnageBasis === 'excel' ? ' Switch to "Invoiced only" if they are duplicates.' : '') });
    }
    // Empty runs
    const bom = inv.filter((l) => isEmptyRun(l.article));
    if (bom.length) {
      const t = bom.reduce((s, l) => s + tonnesOf(l), 0);
      add('info', 'emptyRuns', { t: `${bom.length} bomkörningar`, d: `Tomkörning ger utsläpp men inget gods. ${fmt(t)} t på dessa rader räknas inte som transporterat gods i rensat läge.` },
        { t: `${bom.length} empty runs`, d: `Empty running causes emissions but carries no goods. ${fmtE(t)} t on these rows is not counted as goods in clean mode.` });
    }
    // Non-weight units
    const other = inv.filter((l) => l.unit && !UNIT_TONNES[l.unit]);
    if (other.length) {
      const by = {}; other.forEach((l) => { by[l.unit] = (by[l.unit] || 0) + 1; });
      add('info', 'units', { t: `${other.length} rader debiteras per ${Object.keys(by).join('/')}`, d: 'De ingår i utsläppen men inte i tonnage och tonkilometer.' },
        { t: `${other.length} rows are charged per ${Object.keys(by).join('/')}`, d: 'They count toward emissions but not toward tonnes and tonne-km.' });
    }
    // Distance coverage
    const zeroKm = inv.filter((l) => !l.km);
    if (zeroKm.length) {
      const amt = zeroKm.reduce((s, l) => s + l.amount, 0);
      add(res.totals.tkmCoverage < 0.8 ? 'warning' : 'info', 'distance', { t: `${zeroKm.length} rader saknar avstånd`, d: `${fmt(amt / res.totals.totalInvoiced * 100)} % av beloppet har 0 km, så g CO₂e/tkm bygger på ${fmt(res.totals.tkmCoverage * 100)} % av underlaget. Komplettera avstånd i ordersystemet för ISO 14083-intensitet.` },
        { t: `${zeroKm.length} rows have no distance`, d: `${fmtE(amt / res.totals.totalInvoiced * 100)}% of the amount has 0 km, so g CO₂e/tkm rests on ${fmtE(res.totals.tkmCoverage * 100)}% of the data. Fill in distances in the order system for ISO 14083 intensity.` });
    }
    // Fuel assumption evidence
    const pH = ctx.fuelPlan.hvoPct;
    if (pH > 0 && !extra.receiptsUsed) {
      add('warning', 'hvoEvidence', { t: `${fmt(pH * 100)} % HVO100 antas utan kvitton`, d: 'Påståendet om förnybart drivmedel behöver styrkas med tankkvitton eller leverantörens hållbarhetsbesked, särskilt för Lejd (inhyrda åkerier). Importera kvitton under Kvitton.' },
        { t: `${fmtE(pH * 100)}% HVO100 assumed without receipts`, d: 'The renewable-fuel claim needs fuel receipts or the supplier\'s sustainability declaration, especially for hired hauliers (Lejd). Import receipts under Receipts.' });
    }
    // Factor sanity
    const fH = ctx.fuels[ctx.fuelPlan.hvoFuel];
    const ref = DEFAULT_FUELS.HVO100_SE.wtw;
    if (fH && Math.abs(fH.wtw - ref) / ref > 0.25 && pH > 0) {
      add('info', 'hvoFactor', { t: `HVO-faktorn ${fmt(fH.wtw, 2)} avviker från marknadssnittet ${fmt(ref, 2)}`, d: 'Svenskt snitt 2025 är 0,35 kg CO₂e/l (Drivkraft Sverige 2026). Ett leverantörsspecifikt värde är bättre om det finns ett hållbarhetsbesked som styrker det; spara det dokumentet med rapporten.' },
        { t: `HVO factor ${fmtE(fH.wtw, 2)} differs from the market average ${fmtE(ref, 2)}`, d: 'The Swedish 2025 average is 0.35 kg CO₂e/l (Drivkraft Sverige 2026). A supplier-specific value is better if a sustainability declaration backs it; keep that document with the report.' });
    }
    if (fH && fH.validFrom && ctx.to && fH.validFrom.slice(0, 4) < ctx.to.slice(0, 4)) {
      add('warning', 'factorAge', { t: 'Emissionsfaktorn är från ett tidigare år', d: `Reduktionsplikten ändrar dieselns faktor årligen. Faktorn gäller från ${fH.validFrom}; uppdatera för perioden.` },
        { t: 'The emission factor is from an earlier year', d: `The reduction obligation changes diesel factors yearly. The factor is valid from ${fH.validFrom}; update it for the period.` });
    }
    // Price
    if (!extra.priceFromReceipts) {
      add('info', 'price', { t: `Ett snittpris (${fmt(ctx.prices.hvo, 2)} kr/l) för hela perioden`, d: 'Priset skrivs in för hand idag. Med kvitton räknas pris per drivmedel och period automatiskt.' },
        { t: `One average price (${fmtE(ctx.prices.hvo, 2)} SEK/l) for the whole period`, d: 'The price is typed in by hand today. With receipts the price per fuel and period is calculated automatically.' });
    }
    // Parity
    if (extra.parity) {
      const p = extra.parity;
      if (p.applicable) add(p.ok ? 'ok' : 'warning', 'parity', p.ok ? { t: 'Matchar nuvarande Excel-rapport', d: `${fmt(p.portal, 2)} kg CO₂e mot ${fmt(p.excel, 2)} kg i Excel-rapporten (avvikelse ${fmt(p.diff, 4)} kg).` } : { t: 'Avviker från Excel-rapporten', d: `${fmt(p.portal, 2)} kg mot ${fmt(p.excel, 2)} kg.` },
        p.ok ? { t: 'Matches the current Excel report', d: `${fmtE(p.portal, 2)} kg CO₂e vs ${fmtE(p.excel, 2)} kg in the Excel report (difference ${fmtE(p.diff, 4)} kg).` } : { t: 'Differs from the Excel report', d: `${fmtE(p.portal, 2)} kg vs ${fmtE(p.excel, 2)} kg.` });
    }
    const order = { critical: 0, serious: 1, warning: 2, info: 3, ok: 4 };
    out.sort((a, b) => order[a.sev] - order[b.sev]);
    return out;
  }

  // ---------- Canonical JSON (for hashing) ----------
  function canonical(v) {
    if (v === null || typeof v !== 'object') return JSON.stringify(typeof v === 'number' ? Math.round(v * 1e6) / 1e6 : v);
    if (Array.isArray(v)) return '[' + v.map(canonical).join(',') + ']';
    return '{' + Object.keys(v).sort().filter((k) => v[k] !== undefined).map((k) => JSON.stringify(k) + ':' + canonical(v[k])).join(',') + '}';
  }

    return lines.map((l) => [l.date, l.status, l.resource, l.rtype, l.orderId, l.amount, l.km, l.qty, l.unit, l.article]);
  }

})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* Spårbar report model — turns a calculation result into the plain object every output renders from. */
(function (root) {
  'use strict';
  function fuelShort(key, fuels, lang) {
    if (/^HVO/.test(key)) return 'HVO100';
    if (/^DIESEL/.test(key)) return lang === 'en' ? 'Diesel MK1' : 'Diesel MK1';
    if (key === 'B100') return 'B100';
    const f = fuels[key]; return f ? (f.label[lang] || f.label.sv) : key;
  }
  function buildModel(o) {
    const lang = o.lang, R = (sv, en) => (lang === 'en' ? en : sv);
    const loc = lang === 'en' ? 'en-GB' : 'sv-SE';
    const nf = (n, d = 0) => (n == null || !Number.isFinite(n) ? '–' : new Intl.NumberFormat(loc, { minimumFractionDigits: d, maximumFractionDigits: d }).format(n));
    const pc = (x, d = 0) => nf(x * 100, d) + (lang === 'en' ? '%' : ' %');
    const ctx = o.ctx, res = o.result, t = res.totals;
    const custNo = ctx.customer;
    const custName = (o.settings.customerNames && o.settings.customerNames[custNo]) || R(`Kund ${custNo}`, `Customer ${custNo}`);
    const issuer = (o.settings.issuer || '').trim() || R('Ert företagsnamn', 'Your company name');
    const monthName = (mk) => new Date(Date.UTC(+mk.slice(0, 4), +mk.slice(5, 7) - 1, 1)).toLocaleDateString(loc, { month: 'long', year: 'numeric', timeZone: 'UTC' });
    const usedFuels = [...new Set(res.rows.map((r) => r.fuel))];
    const rows = res.rows.map((r) => Object.assign({}, r, { fuelLabel: fuelShort(r.fuel, ctx.fuels, lang) }));
    const factors = usedFuels.map((k) => { const f = ctx.fuels[k]; return { key: k, label: f.label[lang] || f.label.sv, wtw: f.wtw, ttw: f.ttw, mj: f.mj, validFrom: f.validFrom || '', source: (f.source && (f.source[lang] || f.source.sv)) || '' }; });
    const showIntensityTkm = t.tkmCoverage >= 0.8 && t.tkm > 0;
    const hvoPct = ctx.fuelPlan.hvoPct;
    const typeCount = new Set(res.rows.map((r) => r.code)).size;
    const kgLabel = (kg) => (Math.abs(kg) >= 1000 ? `${nf(kg / 1000, 1)} ${R('ton', 'tonnes')} CO₂e` : `${nf(kg, 0)} kg CO₂e`);

    let narrative = R(
      `Under ${o.period.label.toLowerCase()} utförde vi ${nf(res.invoicedCount)} fakturerade transportuppdrag åt er med ${typeCount} fordonstyper. Klimatpåverkan uppgick till ${kgLabel(t.kgWtw)} räknat från källa till hjul (WTW), varav ${kgLabel(t.kgTtw)} direkta fossila utsläpp från fordonen (TTW).`,
      `During ${o.period.label} we carried out ${nf(res.invoicedCount)} invoiced transport assignments for you with ${typeCount} vehicle types. The climate impact was ${kgLabel(t.kgWtw)} well-to-wheel (WTW), of which ${kgLabel(t.kgTtw)} were direct fossil emissions from the vehicles (TTW).`);

  }
  function reportStatus() {
    const key = reportKey();
    const same = S.archive.filter((a) => a.key === key).sort((a, b) => b.version - a.version);
    if (!same.length) return { status: 'draft', version: null };
    const h = S.hashes.report && S.hashes.report.key === reportSig() ? S.hashes.report.v : null;
    if (h && same[0].reportHash === h) return { status: 'locked', version: same[0].version, rec: same[0] };
    return { status: 'changed', version: same[0].version, rec: same[0] };
  }

  // ---------- review: the employee handles checks and submits, the supervisor approves and locks ----------
  // A report can only be locked when no critical, serious or warning check is open. "Open" means not dealt with:
  // either fixed (the check no longer fires) or marked as handled with a comment. Critical checks: supervisor only.
  const BLOCKING = ['critical', 'serious', 'warning'];
  // Checks about the fleet or the method, not the customer: handled once, valid for every customer in the period.
  const FLEET = /^(excluded-|hvoEvidence$|hvoFactor$|factorAge$|price$)/;
  const isFleet = (c) => FLEET.test(c.id);
  const revKey = (cust, from, to) => `${cust}__${from}__${to}`.replace(/[^A-Za-z0-9_\-.]/g, '_');
  const fleetKey = (from, to) => revKey('alla', from, to);
  // A customer-specific handling stops counting when the check's figures change; a fleet-level one does not.
  const checkFp = (c) => (isFleet(c) ? c.id : `${c.id}|${c.sev}|${c.sv.t}|${c.sv.d}`);
  const reviewOf = (cust, from, to) => S.reviews[revKey(cust, from, to)] || {};
  function ackFor(c, cust, from, to) {
    const doc = S.reviews[isFleet(c) ? fleetKey(from, to) : revKey(cust, from, to)];
    const a = doc && doc.acks && doc.acks[c.id];
    return a && a.fp === checkFp(c) ? a : null;
  }
  const openOf = (checks, cust, from, to) => checks.filter((c) => BLOCKING.includes(c.sev) && !ackFor(c, cust, from, to));
  const openNow = () => (S.ectx ? openOf(S.checks, S.ectx.customer, S.ectx.from, S.ectx.to) : []);
  const roleName = (r) => (r === 'supervisor' ? L('Chef', 'Supervisor') : L('Medarbetare', 'Employee'));
  const who = () => ({ by: S.me || null, name: S.myName || '', role: S.mode, at: new Date().toISOString() });
  // Local date and time for timestamps stored as ISO (UTC).
  const when = (iso, withTime = true) => { const d = new Date(iso); if (!iso || isNaN(d)) return ''; return withTime ? d.toLocaleString(loc(S.lang), { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }) : d.toLocaleDateString(loc(S.lang), { year: 'numeric', month: '2-digit', day: '2-digit' }); };
  const whoText = (w) => (w ? `${w.name || roleName(w.role)} · ${when(w.at)}` : '');
  async function writeReview(key, doc) {
    S.reviews[key] = doc;
    const db = S.caps.db;
    if (db) {
      try { await db.doc('reviews/' + key).set(doc); }
      catch (e) { toast(L('Kunde inte spara i portalen; ändringen finns bara i den här sessionen.', 'Could not save in the portal; the change only lives in this session.')); }
    }
    render();
  }
  function setAck(c, note) {
    const e = S.ectx, key = isFleet(c) ? fleetKey(e.from, e.to) : revKey(e.customer, e.from, e.to);
    const doc = clone(S.reviews[key] || {}); doc.acks = doc.acks || {};
    doc.acks[c.id] = Object.assign({ fp: checkFp(c), sev: c.sev, t: c.sv.t, tEn: c.en.t, note }, who());
    return writeReview(key, doc);
  }
  function clearAck(id) {
    const c = S.checks.find((x) => x.id === id); if (!c) return;
    const e = S.ectx, key = isFleet(c) ? fleetKey(e.from, e.to) : revKey(e.customer, e.from, e.to);
    const doc = clone(S.reviews[key] || {}); if (doc.acks) delete doc.acks[id];
    return writeReview(key, doc);
  }
  // Every handled check of the current report, with who handled it and why (shown to the supervisor, kept when locked).
  function handledNow() {
    const e = S.ectx;
    return S.checks.filter((c) => BLOCKING.includes(c.sev)).map((c) => ({ c, a: ackFor(c, e.customer, e.from, e.to) })).filter((x) => x.a);
  }
  // Status of one customer's report in the period, for the work list.
  function customerState(cust) {
    const c = Object.assign({}, S.ectx, { customer: cust });
    const ev = cust === S.ectx.customer ? { result: S.result, checks: S.checks } : evaluate(c);
    if (!ev.result.invoicedCount) return { kind: 'empty', ev };
    const kg = ev.result.totals.kgWtw;
    const locked = S.archive.filter((a) => a.key === `${cust}|${c.from}|${c.to}`).sort((a, b) => b.version - a.version)[0];
    if (locked && locked.totals && Math.abs(locked.totals.kgWtw - kg) < 0.01) return { kind: 'approved', version: locked.version, rec: locked, kg, ev, open: [] };
    const open = openOf(ev.checks, cust, c.from, c.to);
    const rv = reviewOf(cust, c.from, c.to);
    if (rv.submitted && Math.abs(rv.submitted.kg - kg) < 0.01) return { kind: 'submitted', kg, ev, open, rv };
    return { kind: open.length ? 'open' : 'ready', kg, ev, open, rv, changedAfterLock: !!locked };
  }
  async function submitReport() {
    if (openNow().length) return;
    const e = S.ectx, key = revKey(e.customer, e.from, e.to);
    const doc = clone(S.reviews[key] || {});
    doc.submitted = Object.assign({ kg: S.result.totals.kgWtw }, who()); doc.returned = null;
    await writeReview(key, doc);
    toast(L('Skickad till chefen för godkännande.', 'Sent to the supervisor for approval.'));
  }
  async function returnReport(note) {
    const e = S.ectx, key = revKey(e.customer, e.from, e.to);
    const doc = clone(S.reviews[key] || {});
    doc.submitted = null; doc.returned = Object.assign({ note }, who());
    S.ui.returnOpen = false; S.ui.returnText = '';
    await writeReview(key, doc);
    toast(L('Rapporten är skickad tillbaka med din kommentar.', 'The report was sent back with your comment.'));
  }

  // ---------- capabilities ----------
  function initCaps() {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') { S.archiveState = 'none'; return; }
    c.use('downloads').then((d) => { S.caps.downloads = d; softRefresh(); }).catch(() => {});
    c.use('user').then(async (u) => {
      S.caps.user = u; if (!u) return;
      try { S.me = await u.id(); } catch (e) { S.me = null; }
      try { const p = typeof u.me === 'function' ? await u.me() : null; S.myName = (p && p.name) || ''; } catch (e) { S.myName = ''; }
      if (!S.myName && S.me && u.profiles) { try { const ps = await u.profiles([S.me]); S.myName = (ps && ps[S.me] && ps[S.me].name) || ''; } catch (e) { /* name stays empty; the role is shown instead */ } }
    }).catch(() => {});
    c.use('sample').then((s) => { S.caps.sample = s; if (s && s.limits) s.limits().then((l) => { S.caps.sampleLimits = l; softRefresh(); }).catch(() => {}); softRefresh(); }).catch(() => {});
    S.archiveState = 'loading';
    c.use('db').then((db) => { S.caps.db = db; if (db) subscribeDb(); else S.archiveState = 'none'; softRefresh(); }).catch(() => { S.archiveState = 'none'; });
  }
  function subscribeDb() {
    const db = S.caps.db;
    const timer = setTimeout(() => { if (S.archiveState === 'loading') { S.archiveState = 'slow'; softRefresh(); } }, 10000);
    db.doc('app/settings').onSnapshot((snap) => {
      if (snap.exists && !snap.metadata.hasPendingWrites) {
        const d = snap.data();
        const first = !S.sharedLoaded;
        if (first || !S.dirtyShared) { applyShared(d); if (!first && d.updatedBy !== S.me) toast(L('Gemensamma inställningar uppdaterades.', 'Shared settings were updated.')); }
      }
      S.sharedLoaded = true;
    }, () => {});
    db.collection('reports').orderBy('createdAt', 'desc').limit(300).onSnapshot((qs) => {
      clearTimeout(timer);
      S.archive = qs.docs.map((d) => d.data());
      S.archiveState = 'ready';
      resolveNames(S.archive.map((a) => a.createdBy).filter(Boolean));
      softRefresh();
    }, () => { clearTimeout(timer); S.archiveState = 'error'; softRefresh(); });
    db.collection('reviews').onSnapshot((qs) => {
      const m = {}; qs.docs.forEach((d) => { m[d.id] = d.data(); });
      S.reviews = m; softRefresh();
    }, () => {});
    db.collection('receipts').onSnapshot((qs) => {
      S.receipts.shared = [];
      S.receiptBatches = qs.docs.map((d) => { const b = d.data(); (b.rows || []).forEach((r) => S.receipts.shared.push(Object.assign({ batch: d.id }, r))); return Object.assign({ id: d.id }, b); });
      recompute(); softRefresh();
    }, () => {});
  }
  async function resolveNames(ids) {
    const u = S.caps.user; if (!u || !u.profiles || !ids.length) return;
    try { const ps = await u.profiles([...new Set(ids)]); for (const id of Object.keys(ps || {})) S.names[id] = (ps[id] && ps[id].name) || ''; softRefresh(); } catch (e) { /* names stay unresolved */ }
  }
  function sharedPayload() {
    const c = S.ctx;
    return {
      issuer: S.settings.issuer, customerNames: S.settings.customerNames, reportLang: S.settings.reportLang, showCost: S.settings.showCost,
      prices: c.prices, fuelPlan: c.fuelPlan, tonnageBasis: c.tonnageBasis, fuels: c.fuels, rtOverrides: S.rtOverrides,
      updatedAt: new Date().toISOString(), updatedBy: S.me || null
    };
  }
  function applyShared(d) {
    if (!d) return;
    if (typeof d.issuer === 'string') S.settings.issuer = d.issuer;
    if (d.customerNames && typeof d.customerNames === 'object') S.settings.customerNames = Object.assign({}, d.customerNames);
    if (d.reportLang === 'sv' || d.reportLang === 'en') S.settings.reportLang = d.reportLang;
    if (typeof d.showCost === 'boolean') S.settings.showCost = d.showCost;
    if (d.prices && Number.isFinite(d.prices.hvo) && Number.isFinite(d.prices.diesel)) S.ctx.prices = { hvo: d.prices.hvo, diesel: d.prices.diesel };
    if (d.fuels && typeof d.fuels === 'object') {
      const f = clone(E.DEFAULT_FUELS);
      for (const [k, v] of Object.entries(d.fuels)) if (v && Number.isFinite(v.wtw) && Number.isFinite(v.ttw) && Number.isFinite(v.mj) && (v.shareCol === 'hvo' || v.shareCol === 'diesel')) f[k] = v;
      S.ctx.fuels = f;
    }
    if (d.fuelPlan && S.ctx.fuels[d.fuelPlan.hvoFuel] && S.ctx.fuels[d.fuelPlan.dieselFuel]) S.ctx.fuelPlan = { hvoFuel: d.fuelPlan.hvoFuel, dieselFuel: d.fuelPlan.dieselFuel, hvoPct: Math.min(1, Math.max(0, Number(d.fuelPlan.hvoPct) || 0)), byType: d.fuelPlan.byType || {} };
    if (d.tonnageBasis === 'excel' || d.tonnageBasis === 'invoiced') S.ctx.tonnageBasis = d.tonnageBasis;
    if (d.rtOverrides && typeof d.rtOverrides === 'object') { S.rtOverrides = d.rtOverrides; rebuildRt(); }
    S.dirtyShared = false;
    recompute(); render();
  }
  async function saveShared() {
    const db = S.caps.db;
    if (!db) { toast(L('Gemensam lagring kräver att sidan är öppen i Claude.', 'Shared storage needs the page open in Claude.')); return; }
    try { await db.doc('app/settings').set(sharedPayload()); S.dirtyShared = false; toast(L('Sparat som gemensam standard.', 'Saved as the shared default.')); render(); }
    catch (e) { toast(e && e.code === 'invalid_argument' ? L('Du har inte behörighet att ändra gemensamma inställningar.', 'You do not have permission to change shared settings.') : L('Kunde inte spara. Försök igen.', 'Could not save. Try again.')); }
  }
  const markDirty = () => { S.dirtyShared = true; };

  // ---------- downloads ----------
  async function saveFile(filename, data) {
    const d = S.caps.downloads;
    if (!d) { toast(L('Nedladdning fungerar när sidan är öppen i Claude.', 'Downloads work when the page is open in Claude.')); return false; }
    try { await d.save({ filename, data }); toast(L('Filen är sparad.', 'File saved.')); return true; }
    catch (e) {
      if (e && e.code === 'declined') return false;
      if (e && e.code === 'rate_limited') toast(L('En nedladdning väntar redan på svar.', 'A download is already waiting for an answer.'));
      else toast(L('Nedladdningen gick inte att starta här.', 'The download could not start here.'));
      return false;
    }
  }
  async function doExport(kind) {
    if (!S.result.rows.length) { toast(L('Inget att exportera för vald period.', 'Nothing to export for this period.')); return; }
    await ensureHashes();
    const lang = S.settings.reportLang;
    const m = modelFor(lang, kind === 'xlsx');
    const base = `${lang === 'en' ? 'Climate_report' : 'Klimatrapport'}_${m.customer.no}_${m.period.short}`.replace(/[^A-Za-z0-9_\-.]/g, '_');
    S.ui.busy = kind; softRefresh();
    try {
      if (kind === 'xlsx') { await loadScript(LIBS.xlsx); await saveFile(base + '.xlsx', new Uint8Array(X.buildXlsx(m, window.XLSX))); }
      else if (kind === 'pdf') { await loadScript(LIBS.jspdf); await loadScript(LIBS.autotable); await saveFile(base + '.pdf', new Uint8Array(X.buildPdf(m, window.jspdf.jsPDF))); }
      else if (kind === 'csv') await saveFile(base + '_scope3.csv', X.buildCsv(m));
      else if (kind === 'json') await saveFile(base + '_iso14083.json', X.buildJson(m));
    } catch (e) { toast(L('Exporten misslyckades: biblioteket kunde inte laddas.', 'Export failed: the library could not load.')); }
    S.ui.busy = ''; softRefresh();
  }

  // ---------- lock & verify ----------
  async function lockReport() {
    const db = S.caps.db; if (!db) return;
    if (openNow().length) { S.ui.confirmLock = false; render(); toast(L('Det finns kontroller kvar att hantera.', 'There are checks left to handle.')); return; }
    await ensureHashes();
    const key = reportKey();
    const version = Math.max(0, ...S.archive.filter((a) => a.key === key).map((a) => a.version)) + 1;
    const c = S.ectx, t = S.result.totals, p = periodInfo();
    const id = `${reportId()}-v${version}`;
    const body = {
      id, key, version, reportId: reportId(), customer: c.customer, customerName: custName(c.customer, S.settings.reportLang), period: p.uiLabel, from: c.from, to: c.to,
      issuer: S.settings.issuer || '', lang: S.settings.reportLang,
      totals: { kgWtw: t.kgWtw, kgTtw: t.kgTtw, kgWtt: t.kgWtt, liters: t.liters, tonnes: t.tonnes, tkm: t.tkm, mwh: t.mwh, renewableShare: t.renewableShare, amount: t.amount },
      rows: S.result.rows.map((r) => ({ code: r.code, name: r.name, fuel: r.fuel, liters: r.liters, ef: r.ef, kgWtw: r.kgWtw, amount: r.amount })),
      factors: [...new Set(S.result.rows.map((r) => r.fuel))].map((k) => ({ key: k, wtw: c.fuels[k].wtw, ttw: c.fuels[k].ttw, validFrom: c.fuels[k].validFrom || '', source: c.fuels[k].source ? c.fuels[k].source.sv : '' })),
      prices: c.prices, hvoPct: c.fuelPlan.hvoPct, tonnageBasis: c.tonnageBasis, receipts: S.receiptApplied,
      inputHash: S.hashes.input.v, reportHash: S.hashes.report.v, dataset: { name: S.dataset.name, rows: S.dataset.lines.length, sample: !!S.dataset.isSample },
      openChecks: openNow().map((x) => x.sv.t),
      handled: handledNow().map(({ c: x, a }) => ({ id: x.id, sev: x.sev, t: x.sv.t, tEn: x.en.t, note: a.note, by: a.by || null, name: a.name || '', role: a.role || '', at: a.at || '' })),
      submitted: reviewOf(c.customer, c.from, c.to).submitted || null,
      createdAt: new Date().toISOString(), createdBy: S.me || null, approvedByName: S.myName || '', approvedRole: S.mode
    };
    S.ui.busy = 'lock'; softRefresh();
    try { await db.collection('reports').doc(id.replace(/[^A-Za-z0-9_\-.~:@+]/g, '_')).set(body); S.ui.confirmLock = false; toast(L(`Rapporten är godkänd och låst som version ${version}.`, `The report is approved and locked as version ${version}.`)); }
    catch (e) { toast(e && e.code === 'invalid_argument' ? L('Du har inte behörighet att låsa rapporter.', 'You do not have permission to lock reports.') : L('Låsningen misslyckades. Försök igen.', 'Locking failed. Try again.')); }
    S.ui.busy = ''; render();
  }
  async function verifyArchived(id) {
    const a = S.archive.find((x) => x.id === id); if (!a) return;
    const lines = S.dataset.lines.filter((l) => l.customer === a.customer && l.date >= a.from && l.date <= a.to);
    if (!lines.length) { S.ui.verify[id] = { sev: 'warning', t: L('Underlaget för perioden finns inte i laddad data.', 'The period\'s data is not in the loaded dataset.') }; render(); return; }
    const h = await sha256(E.canonical(E.linesFingerprint(lines)));
    S.ui.verify[id] = h === a.inputHash ? { sev: 'ok', t: L('Underlaget är oförändrat sedan låsning.', 'The input is unchanged since locking.') } : { sev: 'serious', t: L('Underlaget har ändrats sedan låsning.', 'The input has changed since locking.') };
    render();
  }

  // ---------- imports ----------
  async function readTables(file) {
    await loadScript(LIBS.xlsx);
    const buf = await file.arrayBuffer();
    const isCsv = /\.(csv|txt)$/i.test(file.name);
    const wb = isCsv ? window.XLSX.read(new TextDecoder('utf-8').decode(buf), { type: 'string', raw: false }) : window.XLSX.read(buf, { type: 'array' });
    return wb.SheetNames.map((n) => ({ sheet: n, rows: window.XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: null }) }));
  }
  async function importData(files) {
    const found = { orders: [], invoiceLines: [], resourceTypes: null, names: [], namesEn: [], notes: [], excel: null };
    // table descriptions in both languages, so the Data view follows a later language switch
    const pushName = (f) => { const keep = S.lang; S.lang = 'sv'; found.names.push(f()); S.lang = 'en'; found.namesEn.push(f()); S.lang = keep; };
    for (const f of files) {
      if (!/\.(xlsx|xlsm|xls|csv|txt)$/i.test(f.name)) { found.notes.push(L(`${f.name}: filtypen stöds inte.`, `${f.name}: file type not supported.`)); continue; }
      let tables;
      try { tables = await readTables(f); } catch (e) { found.notes.push(L(`${f.name}: kunde inte läsas.`, `${f.name}: could not be read.`)); continue; }
      for (const tb of tables) {
        if (/^rapport$/i.test(tb.sheet)) {
          const rr = tb.rows, total = rr[0] && Number(rr[0][8]), ef = rr[3] && Number(rr[3][4]), price = rr[3] && Number(rr[3][9]);
          const hm = /^([12])-(\d{4})$/.exec(String((rr[3] && rr[3][0]) || '').trim());
          if (Number.isFinite(total) && total > 0 && ef > 0 && price > 0 && hm) found.excel = { totalKg: total, efHvo: ef, price, from: hm[1] === '1' ? `${hm[2]}-01-01` : `${hm[2]}-07-01`, to: hm[1] === '1' ? `${hm[2]}-06-30` : `${hm[2]}-12-31` };
        }
        const c = E.classifyTable(tb.rows);
        if (c.kind === 'orders') { found.orders.push(...c.lines); pushName(() => `${tb.sheet} (${L('orderrader', 'order lines')}, ${c.lines.length})`); }
        else if (c.kind === 'invoiceLines') { found.invoiceLines.push(Object.assign(c, { sheet: tb.sheet })); pushName(() => `${tb.sheet} (${L('fakturarader', 'invoice lines')}, ${c.lines.length}${c.blankAmounts ? ', ' + L('belopp saknas', 'amounts missing') : ''})`); }
        else if (c.kind === 'resourceTypes') { found.resourceTypes = c.rows; pushName(() => `${tb.sheet} (${L('resurstyper', 'vehicle types')}, ${c.rows.length})`); }
      }
    }
    let lines = found.orders;
    const inv = found.invoiceLines.filter((x) => !x.blankAmounts).flatMap((x) => x.lines);
    const invAll = found.invoiceLines.flatMap((x) => x.lines);
    if (!lines.length && inv.length) lines = inv;
    if (!lines.length) { S.ui.importMsg = { sev: 'serious', t: L('Hittade inga orderrader eller fakturarader med belopp.', 'Found no order lines or invoice lines with amounts.'), d: (S.lang === 'en' ? found.namesEn : found.names).concat(found.notes) }; render(); return; }
    // fill customer & supplier from invoice lines when orders lack them
    const invCustomers = [...new Set(invAll.map((l) => l.customer).filter(Boolean))];
    const supByRes = new Map(invAll.filter((l) => l.resource != null && l.supplier != null).map((l) => [l.resource, l.supplier]));
    let filled = 0;
    for (const l of lines) {
      if (!l.customer) { l.customer = invCustomers.length === 1 ? invCustomers[0] : (S.ui.importCustomer || L('okänd', 'unknown')); filled++; }
      if (l.supplier == null && supByRes.has(l.resource)) l.supplier = supByRes.get(l.resource);
    }
    if (filled) found.notes.push(L(`Kundnummer saknades på ${filled} rader och sattes till ${lines[0].customer}.`, `Customer number was missing on ${filled} rows and was set to ${lines[0].customer}.`));
    const rtBase = found.resourceTypes ? E.resourceTypesFrom(found.resourceTypes) : S.dataset.rtBase;
    if (!found.resourceTypes) found.notes.push(L('Ingen resurstypstabell i filen; nuvarande drivmedelsandelar används.', 'No vehicle-type table in the file; current fuel shares are used.'));
    if (found.excel) {
      found.excel.customer = invCustomers.length === 1 ? invCustomers[0] : lines[0].customer;
      found.notes.push(L(`Fliken Rapport hittades: Excel visar ${nf(found.excel.totalKg, 2)} kg CO₂e. Portalen jämför automatiskt.`, `Found the Rapport sheet: Excel shows ${nf(found.excel.totalKg, 2)} kg CO₂e. The portal compares automatically.`));
    }
    setDataset({ name: files.map((f) => f.name).join(', '), isSample: false, source: 'Importerad fil', en: { source: 'Imported file', tables: found.namesEn }, lines, rtBase, tables: found.names, excel: found.excel || null });
    S.ui.importMsg = { sev: 'ok', t: L(`Importerade ${nf(lines.length)} rader.`, `Imported ${nf(lines.length)} rows.`), d: (S.lang === 'en' ? found.namesEn : found.names).concat(found.notes) };
    recompute(); render();
  }

  const EXAMPLE_RECEIPTS = [['2026-01-14', 'HVO100', 412.6, 8913.0], ['2026-02-03', 'HVO100', 388.2, 8268.7], ['2026-02-21', 'Diesel MK1', 301.5, 4848.1], ['2026-03-11', 'HVO100', 455.0, 9873.5],

  function hbarChart(id) {
    const agg = new Map();
    for (const r of S.result.rows) { const a = agg.get(r.code) || { code: r.code, name: r.name, kg: 0, l: 0, amt: 0 }; a.kg += r.kgWtw; a.l += r.liters; a.amt += r.amount; agg.set(r.code, a); }
    let items = [...agg.values()].sort((a, b) => b.kg - a.kg);
    if (S.ui.chartTable[id]) {
      return `<div class="tablewrap"><table><thead><tr><th>${L('Resurstyp', 'Vehicle type')}</th><th class="r">${L('Liter', 'Litres')}</th><th class="r">kg CO₂e</th><th class="r">${L('Andel', 'Share')}</th></tr></thead><tbody>${items.map((a) => `<tr class="click" tabindex="0" data-act="trace" data-code="${esc(a.code)}"><td>${esc(a.name)}</td><td class="r">${nf(a.l)}</td><td class="r">${nf(a.kg, 1)}</td><td class="r">${pct(a.kg / S.result.totals.kgWtw, 1)}</td></tr>`).join('')}</tbody></table></div>`;
    }
    const top = items.slice(0, 8), rest = items.slice(8);
    if (rest.length) top.push({ code: '', name: L(`Övriga ${rest.length} typer`, `Other ${rest.length} types`), kg: rest.reduce((s, a) => s + a.kg, 0), l: rest.reduce((s, a) => s + a.l, 0), other: true });
    const max = Math.max(...top.map((a) => a.kg), 1);
    const tot = S.result.totals.kgWtw;
    return `<div class="hbars">${top.map((a) => `<button class="hbar" ${a.other ? '' : `data-act="trace" data-code="${esc(a.code)}"`} data-tip="<b>${esc(a.name)}</b><br>${nf(a.kg, 1)} kg CO₂e · ${pct(a.kg / tot, 1)}<br>${nf(a.l)} ${L('liter', 'litres')}${a.other ? '' : '<br>' + L('Klicka för att spåra', 'Click to trace')}" aria-label="${esc(a.name)}: ${nf(a.kg, 0)} kg CO₂e">
      <span class="hbar-name">${esc(a.name)}</span><span class="hbar-track"><span class="hbar-fill ${a.other ? 'other' : ''}" style="width:${(Math.max(0, a.kg) / max * 100).toFixed(2)}%"></span></span><span class="hbar-val">${nf(a.kg / 1000, 2)} t</span></button>`).join('')}</div>`;
  }
  function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
  function colChart(id) {
    const m = S.result.monthly;
    if (S.ui.chartTable[id]) {
      return `<div class="tablewrap"><table><thead><tr><th>${L('Månad', 'Month')}</th><th class="r">${L('Liter', 'Litres')}</th><th class="r">kg CO₂e</th></tr></thead><tbody>${m.map((x) => `<tr><td>${esc(monthShort(x.month))} ${x.month.slice(0, 4)}</td><td class="r">${nf(x.liters)}</td><td class="r">${nf(x.kgWtw, 1)}</td></tr>`).join('')}</tbody></table></div>`;
    }
    if (!m.length) return `<div class="empty">${L('Ingen data i perioden.', 'No data in the period.')}</div>`;
    const mx = niceMax(Math.max(...m.map((x) => x.kgWtw)));
    const ticks = [0, 0.5, 1].map((f) => f * mx);
    const maxIdx = m.reduce((bi, x, i) => (x.kgWtw > m[bi].kgWtw ? i : bi), 0);
    return `<div class="cols" role="img" aria-label="${L('Utsläpp per månad', 'Emissions by month')}"><div class="cols-grid">${ticks.map((v) => `<div style="bottom:${(v / mx * 100).toFixed(2)}%"><span>${nf(v / 1000, (mx / 2) % 1000 === 0 ? 0 : 1)} t</span></div>`).join('')}</div>
      ${m.map((x, i) => { const h = Math.max(0, x.kgWtw) / mx * 100; const lab = i === maxIdx || i === m.length - 1; return `<button class="col" data-tip="<b>${esc(monthShort(x.month))} ${x.month.slice(0, 4)}</b><br>${nf(x.kgWtw, 1)} kg CO₂e<br>${nf(x.liters)} ${L('liter', 'litres')}" aria-label="${esc(monthShort(x.month))}: ${nf(x.kgWtw, 0)} kg"><span class="col-fill" style="height:${h.toFixed(2)}%"></span>${lab ? `<span class="col-val" style="bottom:calc(${h.toFixed(2)}% + 4px)">${nf(x.kgWtw / 1000, 1)}</span>` : ''}<span class="col-lbl">${esc(monthShort(x.month))}</span></button>`; }).join('')}</div>`;

  function fuelMixBar() {

    if (/^excluded-/.test(c.id) || c.id === 'hvoFactor' || c.id === 'factorAge') return `<a class="btn ghost small" href="#faktorer">${L('Till faktorer', 'Go to factors')}</a>`;

  }
  function checkRow(c) {
    const T = S.lang === 'en' ? c.en : c.sv;
    const ex = S.ai.explain[c.id];
    const exHtml = ex && ex.t === T.t ? `<div class="ai-box" style="margin-top:8px"><span class="ai-tag">${icon('spark')}Claude${ex.live ? ' · ' + L('skriver…', 'writing…') : ''}</span><div id="ai-exp-${esc(c.id)}" class="${ex.live ? 'ai-live' : ''}">${mdLite(ex.text)}</div></div>` : '';
    const aiBtn = c.sev !== 'ok' && aiReady() && !(ex && ex.t === T.t) ? `<button class="btn ghost small" data-act="aiExplain" data-id="${esc(c.id)}" ${S.ai.busy ? 'disabled' : ''}>${icon('spark')}${L('Förklara med AI', 'Explain with AI')}</button>` : '';
    const formOpen = S.ui.ackOpen === c.id;
    const acts = [formOpen ? '' : ackBox(c), checkAction(c), aiBtn].filter(Boolean).join('');
    const handled = BLOCKING.includes(c.sev) && ackFor(c, S.ectx.customer, S.ectx.from, S.ectx.to);
    return `<div class="check ${handled ? 'is-handled' : ''}"><div>${sevChip(c.sev)}</div><div><b>${esc(T.t)}</b><p>${esc(T.d)}</p>${acts ? `<div class="row" style="margin-top:8px">${acts}</div>` : ''}${formOpen ? ackBox(c) : ''}${exHtml}</div></div>`;
  }
  // Quick answers, so marking a check as handled is two clicks.
  const QUICK = {
    excluded: [['Typen förbrukar inget drivmedel för kunden', 'This type uses no fuel for the customer'], ['Interna poster, inga transporter', 'Internal entries, not transports']],
    negatives: [['Krediteringarna är prisjusteringar', 'The credits are price adjustments'], ['Kontrollerat mot fakturorna', 'Checked against the invoices']],
    hvoEvidence: [['Hållbarhetsbesked finns från leverantören', 'The supplier has issued a sustainability statement'], ['De inhyrda åkerierna har intygat HVO100', 'The hired hauliers have confirmed HVO100']],
    tonnage: [['Kunden vill ha tonnage som tidigare', 'The customer wants tonnage as before'], ['Stämmer med Excel-rapporten', 'Matches the Excel report']],
    distance: [['Avstånd saknas i ordersystemet för de raderna', 'The order system has no distance for those rows']],
    factorAge: [['Faktorn är kontrollerad för perioden', 'The factor is checked for the period']],
    parity: [['Skillnaden är förklarad', 'The difference is explained']]
  };
  const quickFor = (c) => (QUICK[/^excluded-/.test(c.id) ? 'excluded' : c.id] || []).concat([['Kontrollerat, stämmer', 'Checked, correct']]);
  function ackBox(c) {
    if (!BLOCKING.includes(c.sev)) return '';
    const e = S.ectx, a = ackFor(c, e.customer, e.from, e.to);
    if (a) return `<div class="handled">${icon('check')}<div><b>${L('Hanterad', 'Handled')}:</b> ${esc(a.note)}<br><span class="tiny muted">${esc(whoText(a))}${isFleet(c) ? ' · ' + L('gäller alla kunder i perioden', 'applies to every customer in the period') : ''}</span></div><button class="btn ghost small" data-act="ackUndo" data-id="${esc(c.id)}">${L('Ångra', 'Undo')}</button></div>`;
    if (c.sev === 'critical' && EMP()) return `<p class="small" style="color:var(--critical-text)">${L('Det här kan bara chefen godkänna.', 'Only the supervisor can accept this.')}</p>`;
    if (S.ui.ackOpen !== c.id) return `<button class="btn small" data-act="ackOpen" data-id="${esc(c.id)}">${icon('check')}${EMP() ? L('Det stämmer', 'This is correct') : L('Markera som hanterad', 'Mark as handled')}</button>`;
    const i = S.lang === 'en' ? 1 : 0;
    return `<div class="ackform">
      <label class="field"><span>${EMP() ? L('Kort kommentar till chefen', 'A short comment for the supervisor') : L('Kommentar, sparas med rapporten', 'Comment, kept with the report')}</span><input type="text" id="ack-${esc(c.id)}" data-ack="${esc(c.id)}" value="${esc(S.ui.ackText[c.id] || '')}" placeholder="${L('Varför stämmer det?', 'Why is it correct?')}" maxlength="240" autocomplete="off"></label>

  // ----- report -----

    const pc = (x, d = 0) => n(x * 100, d) + (m.lang === 'en' ? '%' : ' %');

      <div class="doc-meta">
        <div><div class="lbl">${R('Kund', 'Customer')}</div><div>${esc(m.customer.name)} <span style="color:var(--paper-muted);font-weight:400">(${R('kundnr', 'no.')} ${esc(m.customer.no)})</span></div></div>
        <div><div class="lbl">${R('Period', 'Period')}</div><div>${esc(m.period.label)} · ${m.period.from} – ${m.period.to}</div></div>
        <div><div class="lbl">${R('Rapport-ID', 'Report ID')}</div><div>${esc(m.id)}${m.version ? ' · v' + m.version : ''} · ${m.issued}</div></div>

        <div><div class="k">${R('Transporterat gods', 'Goods transported')}</div><div class="v">${n(t.tonnes)} <small>${R('ton', 'tonnes')}</small></div></div>
        <div><div class="k">${R('Intensitet', 'Intensity')}</div><div class="v">${n(t.kgPerTonne, 2)} <small>kg CO₂e/t</small></div></div>
        <div><div class="k">${R('Förnybart drivmedel', 'Renewable fuel')}</div><div class="v">${pc(t.renewableShare)} <small>${R('av energin', 'of energy')}</small></div></div>
      </div>
      <p id="doc-narr">${esc(m.narrative)}</p>${m.aiNarrative ? (EMP() ? `<span class="ai-mark">${R('Textförslag, granskat före godkännande', 'Suggested text, reviewed before approval')}</span>` : `<span class="ai-mark">${icon('spark')}${R('AI-text, granskad före låsning', 'AI text, reviewed before locking')}</span>`) : ''}
